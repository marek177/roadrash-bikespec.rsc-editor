name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'RoadRashBikeSpecEditor/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\RoadRashBikeSpecEditor\RoadRashBikeSpecEditor.csproj

      - name: Build
        run: dotnet build .\RoadRashBikeSpecEditor\RoadRashBikeSpecEditor.csproj -c Release --no-restore

      - name: Publish standalone win-x64
        run: dotnet publish .\RoadRashBikeSpecEditor\RoadRashBikeSpecEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RoadRash-BikeSpec-Editor-win-x64
          path: publish/**
          if-no-files-found: error
